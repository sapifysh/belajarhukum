<!doctype html>
<html lang="id" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>My Study Space</title>
    <meta name="description" content="A private, minimal, premium study platform for university courses with comprehensive course material and practice questions." />
    <meta property="og:title" content="My Study Space" />
    <meta property="og:description" content="A private, minimal, premium study platform for university courses with comprehensive course material and practice questions." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var i = 0; i < regs.length; i++) {
              regs[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var j = 0; j < names.length; j++) {
              caches.delete(names[j]);
            }
          });
        }
        try {
          var purgeRegex = /companion|3d|character|model|video/i;
          for (var k in localStorage) {
            if (purgeRegex.test(k)) localStorage.removeItem(k);
          }
          for (var sk in sessionStorage) {
            if (purgeRegex.test(sk)) sessionStorage.removeItem(sk);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#0b0f14] text-[#e2e8f0] antialiased selection:bg-slate-700 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
